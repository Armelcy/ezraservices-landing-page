<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezra Admin - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config-local.js"></script>
    <style>
        :root {
            --ezra-orange: #FF6B35;
            --ezra-orange-dark: #E55A2B;
            --ezra-navy: #1B365D;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-900: #111827;
            --success: #10B981;
            --error: #EF4444;
            --warning: #F59E0B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--ezra-navy) 0%, var(--ezra-orange) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            padding: 32px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--ezra-orange), var(--ezra-orange-dark));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            color: white;
            margin: 0 auto 16px;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--ezra-navy);
            margin-bottom: 4px;
        }

        .logo p {
            color: #6B7280;
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 8px;
            font-size: 0.875rem;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--ezra-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--ezra-orange), var(--ezra-orange-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .alert-error {
            background: #FEE2E2;
            color: #DC2626;
            border: 1px solid #FECACA;
        }

        .alert-success {
            background: #D1FAE5;
            color: #059669;
            border: 1px solid #A7F3D0;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--ezra-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .security-info {
            background: var(--gray-50);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .security-info h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .security-info p {
            font-size: 0.875rem;
            color: #6B7280;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <h1>Ezra Admin</h1>
            <p>Administrative Portal</p>
        </div>

        <div class="security-info">
            <h3>🔐 Secure Login</h3>
            <p>Enter your admin credentials to access the dashboard</p>
        </div>

        <div id="error-message" class="alert alert-error" style="display: none;"></div>
        <div id="success-message" class="alert alert-success" style="display: none;"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="email">Admin Email</label>
                <input type="email" id="email" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" required>
            </div>
            
            <button type="submit" class="btn btn-primary" id="login-btn">
                Sign In
            </button>
        </form>
    </div>

    <script>
        let supabaseClient = null;

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Initializing simple admin login...');
            
            // Initialize Supabase client
            supabaseClient = window.supabase.createClient(
                window.EZRA_CONFIG.SUPABASE_URL,
                window.EZRA_CONFIG.SUPABASE_ANON_KEY
            );
            
            // Check if already authenticated
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                console.log('✅ Already authenticated, checking admin status...');
                const isAdmin = await checkAdminStatus(session.user);
                if (isAdmin) {
                    redirectToDashboard();
                    return;
                }
            }

            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('login-form').addEventListener('submit', handleLogin);
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }
            
            setLoading(true);
            hideMessages();

            try {
                console.log('🔐 Attempting login for:', email);
                
                // Step 1: Authenticate with Supabase
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    throw new Error(error.message);
                }

                // Step 2: Check admin status
                const isAdmin = await checkAdminStatus(data.user);
                if (!isAdmin) {
                    await supabaseClient.auth.signOut();
                    throw new Error('Access denied: Admin privileges required');
                }

                console.log('✅ Admin login successful');
                showSuccess('Login successful! Redirecting to dashboard...');
                
                setTimeout(redirectToDashboard, 1500);

            } catch (error) {
                console.error('❌ Login failed:', error);
                let errorMessage = error.message;
                
                // User-friendly error messages
                if (errorMessage.includes('Invalid login credentials')) {
                    errorMessage = 'Invalid email or password. Please check your credentials.';
                } else if (errorMessage.includes('Admin privileges required')) {
                    errorMessage = 'Access denied: This account does not have admin privileges.';
                }
                
                showError(errorMessage);
            }

            setLoading(false);
        }

        async function checkAdminStatus(user) {
            try {
                const { data: profile, error } = await supabaseClient
                    .from('profiles')
                    .select('role, full_name, email')
                    .eq('id', user.id)
                    .single();

                if (error) {
                    console.error('❌ Profile check failed:', error);
                    return false;
                }

                console.log('👤 User profile:', profile);
                return profile?.role === 'admin';

            } catch (error) {
                console.error('❌ Admin status check failed:', error);
                return false;
            }
        }

        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function showSuccess(message) {
            const successElement = document.getElementById('success-message');
            successElement.textContent = message;
            successElement.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }

        function setLoading(loading) {
            const loginBtn = document.getElementById('login-btn');
            if (loading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading"></span> Signing In...';
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Sign In';
            }
        }

        function redirectToDashboard() {
            window.location.href = './admin.html';
        }
    </script>
</body>
</html>
