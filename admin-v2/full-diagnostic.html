<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Admin Diagnostic</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config-local.js"></script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #000;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #ff6b35;
        }
        .test-section {
            margin-bottom: 30px;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 4px;
        }
        .test-title {
            color: #ff6b35;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .success {
            background: #0d4f1c;
            border-left: 4px solid #00ff00;
        }
        .error {
            background: #4f0d0d;
            border-left: 4px solid #ff0000;
        }
        .warning {
            background: #4f4f0d;
            border-left: 4px solid #ffff00;
        }
        .info {
            background: #0d2f4f;
            border-left: 4px solid #00aaff;
        }
        button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #e55a2b;
        }
        .code {
            background: #222;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        input {
            margin: 5px;
            padding: 8px;
            background: #333;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Full Admin Diagnostic Suite</h1>
            <p>Comprehensive testing to identify login loop issues</p>
        </div>

        <div class="grid">
            <div>
                <div class="test-section">
                    <div class="test-title">📊 Database Structure</div>
                    <button onclick="checkDatabaseStructure()">Check Tables & Columns</button>
                    <div id="db-structure"></div>
                </div>

                <div class="test-section">
                    <div class="test-title">👥 User Data</div>
                    <button onclick="checkUsers()">List All Users</button>
                    <div id="user-data"></div>
                </div>

                <div class="test-section">
                    <div class="test-title">🔐 Auth Flow Test</div>
                    <input type="email" id="test-email" placeholder="Admin email">
                    <input type="password" id="test-password" placeholder="Password">
                    <button onclick="fullAuthTest()">Full Auth Flow Test</button>
                    <div id="auth-flow"></div>
                </div>
            </div>

            <div>
                <div class="test-section">
                    <div class="test-title">🌐 Session & Storage</div>
                    <button onclick="checkSessionStorage()">Check Browser Storage</button>
                    <button onclick="clearAllStorage()">Clear All Storage</button>
                    <div id="session-storage"></div>
                </div>

                <div class="test-section">
                    <div class="test-title">⚙️ Configuration</div>
                    <button onclick="checkConfiguration()">Verify Config</button>
                    <div id="config-check"></div>
                </div>

                <div class="test-section">
                    <div class="test-title">🔧 Create Test Admin</div>
                    <input type="email" id="new-admin-email" placeholder="test-admin@example.com">
                    <input type="password" id="new-admin-password" placeholder="Password123!">
                    <button onclick="createTestAdmin()">Create Test Admin</button>
                    <div id="create-admin"></div>
                </div>
            </div>
        </div>

        <div class="test-section">
            <div class="test-title">📋 Complete Diagnostic Report</div>
            <button onclick="runFullDiagnostic()">Run Full Diagnostic</button>
            <div id="full-report"></div>
        </div>
    </div>

    <script>
        let supabase;

        document.addEventListener('DOMContentLoaded', () => {
            supabase = window.supabase.createClient(
                window.EZRA_CONFIG.SUPABASE_URL,
                window.EZRA_CONFIG.SUPABASE_ANON_KEY
            );
            log('config-check', '✅ Supabase client initialized', 'success');
        });

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const div = document.createElement('div');
            div.className = \`result \${type}\`;
            div.innerHTML = \`[${new Date().toLocaleTimeString()}] \${message}\`;
            element.appendChild(div);
        }

        async function checkDatabaseStructure() {
            try {
                log('db-structure', '🔄 Checking database structure...', 'info');
                
                // Check profiles table
                const { data: profiles, error: profilesError } = await supabase
                    .from('profiles')
                    .select('*')
                    .limit(1);

                if (profilesError) {
                    log('db-structure', \`❌ Profiles table error: \${profilesError.message}\`, 'error');
                } else {
                    const columns = profiles.length > 0 ? Object.keys(profiles[0]) : 'Table exists but empty';
                    log('db-structure', \`✅ Profiles table exists. Columns: \${JSON.stringify(columns)}\`, 'success');
                }

                // Check other tables
                const tables = ['providers', 'bookings', 'transactions'];
                for (const table of tables) {
                    try {
                        const { data, error } = await supabase.from(table).select('count', { count: 'exact', head: true });
                        if (error) {
                            log('db-structure', \`❌ \${table} table: \${error.message}\`, 'error');
                        } else {
                            log('db-structure', \`✅ \${table} table exists (count: \${data})\`, 'success');
                        }
                    } catch (e) {
                        log('db-structure', \`❌ \${table} table: \${e.message}\`, 'error');
                    }
                }

            } catch (error) {
                log('db-structure', \`❌ Database check failed: \${error.message}\`, 'error');
            }
        }

        async function checkUsers() {
            try {
                log('user-data', '🔄 Checking user data...', 'info');
                
                // Get auth users (if possible)
                const { data: { users }, error } = await supabase.auth.admin.listUsers();
                if (error) {
                    log('user-data', \`⚠️ Can't list auth users: \${error.message}\`, 'warning');
                } else {
                    log('user-data', \`✅ Found \${users.length} auth users\`, 'success');
                }

                // Get profile records
                const { data: profiles, error: profileError } = await supabase
                    .from('profiles')
                    .select('id, email, role, full_name')
                    .limit(10);

                if (profileError) {
                    log('user-data', \`❌ Can't read profiles: \${profileError.message}\`, 'error');
                } else {
                    log('user-data', \`✅ Found \${profiles.length} profile records:\`, 'success');
                    profiles.forEach(profile => {
                        log('user-data', \`  - \${profile.email} (\${profile.role || 'no role'})\`, 'info');
                    });
                }

            } catch (error) {
                log('user-data', \`❌ User check failed: \${error.message}\`, 'error');
            }
        }

        async function fullAuthTest() {
            const email = document.getElementById('test-email').value;
            const password = document.getElementById('test-password').value;

            if (!email || !password) {
                log('auth-flow', '⚠️ Please enter email and password', 'warning');
                return;
            }

            try {
                log('auth-flow', \`🔄 Testing full auth flow for: \${email}\`, 'info');
                
                // Step 1: Sign out any existing session
                await supabase.auth.signOut();
                log('auth-flow', '✅ Cleared existing session', 'success');

                // Step 2: Sign in
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (authError) {
                    log('auth-flow', \`❌ Auth failed: \${authError.message}\`, 'error');
                    return;
                }

                log('auth-flow', \`✅ Auth successful! User ID: \${authData.user.id}\`, 'success');

                // Step 3: Get session
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError || !session) {
                    log('auth-flow', \`❌ Session error: \${sessionError?.message || 'No session'}\`, 'error');
                } else {
                    log('auth-flow', \`✅ Session valid. Expires: \${new Date(session.expires_at * 1000)}\`, 'success');
                }

                // Step 4: Check profile
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', authData.user.id)
                    .single();

                if (profileError) {
                    log('auth-flow', \`❌ Profile query failed: \${profileError.message}\`, 'error');
                } else {
                    log('auth-flow', \`✅ Profile found: \${JSON.stringify(profile, null, 2)}\`, 'success');
                }

                // Step 5: Test admin redirect logic
                if (profile && profile.role === 'admin') {
                    log('auth-flow', '✅ User is admin - should redirect to dashboard', 'success');
                } else {
                    log('auth-flow', \`⚠️ User role is '\${profile?.role || 'undefined'}' - not admin\`, 'warning');
                }

            } catch (error) {
                log('auth-flow', \`❌ Auth flow error: \${error.message}\`, 'error');
            }
        }

        async function checkSessionStorage() {
            try {
                log('session-storage', '🔄 Checking browser storage...', 'info');
                
                // Check localStorage
                const localStorageKeys = Object.keys(localStorage);
                log('session-storage', \`📦 localStorage keys: \${JSON.stringify(localStorageKeys)}\`, 'info');
                
                // Check sessionStorage
                const sessionStorageKeys = Object.keys(sessionStorage);
                log('session-storage', \`📦 sessionStorage keys: \${JSON.stringify(sessionStorageKeys)}\`, 'info');

                // Check Supabase auth state
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    log('session-storage', \`✅ Active Supabase session for: \${session.user.email}\`, 'success');
                } else {
                    log('session-storage', '❌ No active Supabase session', 'error');
                }

                // Check cookies
                log('session-storage', \`🍪 Document cookies: \${document.cookie || 'None'}\`, 'info');

            } catch (error) {
                log('session-storage', \`❌ Storage check error: \${error.message}\`, 'error');
            }
        }

        function clearAllStorage() {
            try {
                localStorage.clear();
                sessionStorage.clear();
                // Clear Supabase session
                supabase.auth.signOut();
                log('session-storage', '✅ Cleared all storage and signed out', 'success');
            } catch (error) {
                log('session-storage', \`❌ Clear storage error: \${error.message}\`, 'error');
            }
        }

        function checkConfiguration() {
            try {
                log('config-check', '🔄 Checking configuration...', 'info');
                
                log('config-check', \`📍 Supabase URL: \${window.EZRA_CONFIG.SUPABASE_URL}\`, 'info');
                log('config-check', \`🔑 Anon Key: \${window.EZRA_CONFIG.SUPABASE_ANON_KEY.substring(0, 20)}...\`, 'info');
                
                // Check if URL is reachable
                fetch(window.EZRA_CONFIG.SUPABASE_URL + '/rest/v1/')
                    .then(response => {
                        if (response.ok || response.status === 401) {
                            log('config-check', '✅ Supabase URL is reachable', 'success');
                        } else {
                            log('config-check', \`❌ Supabase URL returned: \${response.status}\`, 'error');
                        }
                    })
                    .catch(error => {
                        log('config-check', \`❌ Supabase URL unreachable: \${error.message}\`, 'error');
                    });

            } catch (error) {
                log('config-check', \`❌ Config check error: \${error.message}\`, 'error');
            }
        }

        async function createTestAdmin() {
            const email = document.getElementById('new-admin-email').value;
            const password = document.getElementById('new-admin-password').value;

            if (!email || !password) {
                log('create-admin', '⚠️ Please enter email and password for test admin', 'warning');
                return;
            }

            try {
                log('create-admin', \`🔄 Creating test admin: \${email}\`, 'info');

                // Sign up new user
                const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
                    email,
                    password
                });

                if (signUpError) {
                    log('create-admin', \`❌ Signup failed: \${signUpError.message}\`, 'error');
                    return;
                }

                log('create-admin', \`✅ Created auth user: \${signUpData.user.id}\`, 'success');

                // Create profile with admin role
                const { data: profileData, error: profileError } = await supabase
                    .from('profiles')
                    .insert([{
                        id: signUpData.user.id,
                        email: email,
                        full_name: 'Test Admin',
                        role: 'admin'
                    }])
                    .select();

                if (profileError) {
                    log('create-admin', \`❌ Profile creation failed: \${profileError.message}\`, 'error');
                } else {
                    log('create-admin', \`✅ Created admin profile: \${JSON.stringify(profileData)}\`, 'success');
                    log('create-admin', \`🎯 Try logging in with: \${email} / \${password}\`, 'success');
                }

            } catch (error) {
                log('create-admin', \`❌ Test admin creation error: \${error.message}\`, 'error');
            }
        }

        async function runFullDiagnostic() {
            log('full-report', '🚀 Running full diagnostic...', 'info');
            
            await checkConfiguration();
            await checkDatabaseStructure();
            await checkUsers();
            await checkSessionStorage();
            
            log('full-report', '✅ Full diagnostic complete. Check individual sections for details.', 'success');
        }
    </script>
</body>
</html>
