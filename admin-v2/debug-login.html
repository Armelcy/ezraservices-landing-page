<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Admin Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config-local.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #FF6B35; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #E55A2B; }
        .result { margin: 20px 0; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>🔍 Debug Admin Login</h1>
    <p>This page will show the exact error messages from Supabase to help debug the login issue.</p>
    
    <div id="config-check" class="result info">
        <strong>Checking configuration...</strong>
    </div>
    
    <form id="loginForm">
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="cyriac.leukam@gmail.com" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">🔐 Test Login</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        let supabase;
        
        // Check configuration
        function checkConfig() {
            const configDiv = document.getElementById('config-check');
            
            if (typeof window.EZRA_CONFIG === 'undefined') {
                configDiv.className = 'result error';
                configDiv.innerHTML = '<strong>❌ ERROR:</strong> EZRA_CONFIG not found. config-local.js not loaded.';
                return false;
            }
            
            if (!window.EZRA_CONFIG.SUPABASE_URL) {
                configDiv.className = 'result error';
                configDiv.innerHTML = '<strong>❌ ERROR:</strong> SUPABASE_URL not configured.';
                return false;
            }
            
            if (!window.EZRA_CONFIG.SUPABASE_ANON_KEY) {
                configDiv.className = 'result error';
                configDiv.innerHTML = '<strong>❌ ERROR:</strong> SUPABASE_ANON_KEY is null or empty.';
                return false;
            }
            
            configDiv.className = 'result success';
            configDiv.innerHTML = `
                <strong>✅ Configuration OK:</strong><br>
                URL: ${window.EZRA_CONFIG.SUPABASE_URL}<br>
                Key: ${window.EZRA_CONFIG.SUPABASE_ANON_KEY.substring(0, 20)}...
            `;
            
            // Initialize Supabase
            supabase = window.supabase.createClient(
                window.EZRA_CONFIG.SUPABASE_URL,
                window.EZRA_CONFIG.SUPABASE_ANON_KEY
            );
            
            return true;
        }
        
        // Test login
        async function testLogin(email, password) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result info"><strong>🔄 Testing login...</strong></div>';
            
            try {
                // Step 1: Test basic authentication
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <strong>❌ Authentication Failed:</strong><br>
                            <strong>Error Code:</strong> ${error.error_code || 'unknown'}<br>
                            <strong>Message:</strong> ${error.message}<br>
                            <strong>Status:</strong> ${error.status || 'unknown'}
                        </div>
                    `;
                    return;
                }
                
                // Step 2: Check if user is admin
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role, full_name, email')
                    .eq('id', data.user.id)
                    .single();
                
                if (profileError) {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <strong>❌ Profile Check Failed:</strong><br>
                            <strong>Message:</strong> ${profileError.message}
                        </div>
                    `;
                    return;
                }
                
                if (profile?.role !== 'admin') {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <strong>❌ Access Denied:</strong><br>
                            User role: ${profile?.role || 'unknown'}<br>
                            Required role: admin
                        </div>
                    `;
                    return;
                }
                
                // Success!
                resultDiv.innerHTML = `
                    <div class="result success">
                        <strong>✅ LOGIN SUCCESSFUL!</strong><br>
                        <strong>User:</strong> ${profile.full_name} (${profile.email})<br>
                        <strong>Role:</strong> ${profile.role}<br>
                        <strong>User ID:</strong> ${data.user.id}
                    </div>
                `;
                
                // Clean up session
                await supabase.auth.signOut();
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ Unexpected Error:</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            if (!checkConfig()) {
                document.getElementById('loginForm').style.display = 'none';
            }
        });
        
        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            testLogin(email, password);
        });
    </script>
</body>
</html>
