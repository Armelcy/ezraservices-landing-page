<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Connection Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config-local.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; }
        .test-result { margin: 1rem 0; padding: 1rem; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        pre { background: #f8f9fa; padding: 1rem; border-radius: 4px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🔌 Supabase Connection Test</h1>
    <div id="results"></div>

    <script>
        async function testSupabaseConnection() {
            const resultsDiv = document.getElementById('results');
            
            function addResult(message, type = 'info') {
                const div = document.createElement('div');
                div.className = `test-result ${type}`;
                div.innerHTML = message;
                resultsDiv.appendChild(div);
            }

            try {
                // Test 1: Check if config is loaded
                addResult('🔧 Testing configuration loading...', 'info');
                
                if (!window.EZRA_CONFIG) {
                    addResult('❌ EZRA_CONFIG not found', 'error');
                    return;
                }
                
                addResult(`✅ Configuration loaded:<br>
                    URL: ${window.EZRA_CONFIG.SUPABASE_URL}<br>
                    Key length: ${window.EZRA_CONFIG.SUPABASE_ANON_KEY?.length || 0} characters`, 'success');

                // Test 2: Initialize Supabase client
                addResult('🔧 Initializing Supabase client...', 'info');
                
                if (!window.supabase) {
                    addResult('❌ Supabase library not loaded', 'error');
                    return;
                }

                const supabase = window.supabase.createClient(
                    window.EZRA_CONFIG.SUPABASE_URL,
                    window.EZRA_CONFIG.SUPABASE_ANON_KEY
                );

                addResult('✅ Supabase client initialized', 'success');

                // Test 3: Test basic connection
                addResult('🔧 Testing basic connection...', 'info');
                
                const { data, error } = await supabase
                    .from('profiles')
                    .select('count', { count: 'exact', head: true })
                    .limit(1);

                if (error) {
                    addResult(`⚠️ Profiles table test failed: ${error.message}`, 'error');
                    
                    // Try auth table instead
                    addResult('🔧 Testing auth.users table...', 'info');
                    const { data: authData, error: authError } = await supabase.auth.getUser();
                    
                    if (authError) {
                        addResult(`❌ Auth test failed: ${authError.message}`, 'error');
                    } else {
                        addResult('✅ Auth system is accessible', 'success');
                    }
                } else {
                    addResult(`✅ Profiles table accessible, count: ${data}`, 'success');
                }

                // Test 4: List all tables
                addResult('🔧 Attempting to list available tables...', 'info');
                
                const tables = ['profiles', 'bookings', 'transactions', 'services', 'users'];
                for (const table of tables) {
                    try {
                        const { data, error } = await supabase
                            .from(table)
                            .select('count', { count: 'exact', head: true })
                            .limit(1);
                        
                        if (error) {
                            addResult(`❌ Table "${table}": ${error.message}`, 'error');
                        } else {
                            addResult(`✅ Table "${table}": accessible`, 'success');
                        }
                    } catch (e) {
                        addResult(`❌ Table "${table}": ${e.message}`, 'error');
                    }
                }

                // Test 5: Test actual data retrieval
                addResult('🔧 Testing data retrieval from profiles...', 'info');
                try {
                    const { data: profilesData, error: profilesError } = await supabase
                        .from('profiles')
                        .select('*')
                        .limit(5);
                    
                    if (profilesError) {
                        addResult(`❌ Data retrieval failed: ${profilesError.message}`, 'error');
                    } else {
                        addResult(`✅ Retrieved ${profilesData?.length || 0} profiles:<br>
                            <pre>${JSON.stringify(profilesData, null, 2)}</pre>`, 'success');
                    }
                } catch (e) {
                    addResult(`❌ Data retrieval error: ${e.message}`, 'error');
                }

            } catch (error) {
                addResult(`💥 Critical error: ${error.message}<br><pre>${error.stack}</pre>`, 'error');
            }
        }

        // Run test when page loads
        window.addEventListener('load', testSupabaseConnection);
    </script>
</body>
</html>
