<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Ezra Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config-local.js"></script>
    <style>
        :root {
            --ezra-orange: #FF6B35;
            --ezra-orange-dark: #E55A2B;
            --ezra-navy: #1B365D;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
            --success: #10B981;
            --error: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--ezra-navy) 0%, var(--ezra-orange) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { 
                transform: translateY(30px); 
                opacity: 0; 
            }
            to { 
                transform: translateY(0); 
                opacity: 1; 
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 2rem;
            font-weight: 800;
            color: var(--ezra-navy);
            margin-bottom: 8px;
        }

        .logo-subtitle {
            color: var(--gray-600);
            font-size: 1rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 8px;
            font-size: 0.875rem;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--gray-50);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--ezra-orange);
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .reset-btn {
            width: 100%;
            background: var(--ezra-orange);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .reset-btn:hover:not(:disabled) {
            background: var(--ezra-orange-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3);
        }

        .reset-btn:disabled {
            background: var(--gray-300);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.875rem;
            border-left: 4px solid;
        }

        .message.error {
            background: #FEE2E2;
            color: #DC2626;
            border-left-color: #DC2626;
        }

        .message.success {
            background: #D1FAE5;
            color: #065F46;
            border-left-color: #10B981;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--ezra-orange);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo-section">
            <div class="logo">
                <i class="fas fa-crown" style="color: var(--ezra-orange);"></i>
                Ezra Admin
            </div>
            <div class="logo-subtitle">Reset Your Password</div>
        </div>

        <div id="message-area"></div>

        <div id="loading-state" style="display: none; text-align: center; padding: 40px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--ezra-orange);"></i>
            <p style="margin-top: 16px; color: var(--gray-600);">Processing your request...</p>
        </div>

        <form id="reset-form">
            <div class="form-group">
                <label for="new-password" class="form-label">New Password</label>
                <input 
                    type="password" 
                    id="new-password" 
                    class="form-input" 
                    placeholder="Enter your new password"
                    required
                    minlength="6"
                >
            </div>

            <div class="form-group">
                <label for="confirm-password" class="form-label">Confirm New Password</label>
                <input 
                    type="password" 
                    id="confirm-password" 
                    class="form-input" 
                    placeholder="Confirm your new password"
                    required
                    minlength="6"
                >
            </div>

            <button type="submit" class="reset-btn" id="reset-btn">
                Update Password
            </button>
        </form>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        let supabase = null;

        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Supabase
            if (window.supabase && window.EZRA_CONFIG) {
                supabase = window.supabase.createClient(
                    window.EZRA_CONFIG.SUPABASE_URL,
                    window.EZRA_CONFIG.SUPABASE_ANON_KEY
                );
                
                // Check if we have a recovery token in the URL
                const urlParams = new URLSearchParams(window.location.search);
                const accessToken = urlParams.get('access_token');
                const refreshToken = urlParams.get('refresh_token');
                
                if (accessToken && refreshToken) {
                    // Set the session
                    supabase.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                } else {
                    showMessage('No reset token found in URL. Please use the link from your email.', 'error');
                }
            } else {
                showMessage('Configuration error. Please contact support.', 'error');
            }

            // Setup form submission
            document.getElementById('reset-form').addEventListener('submit', handlePasswordReset);
        });

        async function handlePasswordReset(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const resetBtn = document.getElementById('reset-btn');
            
            // Validation
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters long', 'error');
                return;
            }
            
            // Show loading state
            resetBtn.disabled = true;
            showMessage('Updating your password...', 'success');
            
            try {
                const { data, error } = await supabase.auth.updateUser({
                    password: newPassword
                });
                
                if (error) {
                    throw error;
                }
                
                showMessage('Password updated successfully! Redirecting to login...', 'success');
                
                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                console.error('Password reset error:', error);
                showMessage(error.message || 'Failed to update password. Please try again.', 'error');
                resetBtn.disabled = false;
            }
        }

        function showMessage(message, type) {
            const messageArea = document.getElementById('message-area');
            messageArea.innerHTML = `<div class="message ${type}">${message}</div>`;
        }
    </script>
</body>
</html>
