<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processus de Résolution - Ezra Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config-local.js"></script>
    <script src="admin-auth-simple.js"></script>
    <script src="enhanced-security.js"></script>
    <style>
        :root {
            --ezra-orange: #FF6B35;
            --ezra-orange-dark: #E55A2B;
            --ezra-navy: #1B365D;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
            --success: #10B981;
            --error: #EF4444;
            --warning: #F59E0B;
            --info: #3B82F6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--gray-900);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--ezra-navy) 0%, #2C4B73 100%);
            border-bottom: 1px solid rgba(255, 107, 53, 0.2);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(27, 54, 93, 0.15);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 800;
            color: white;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: white;
            background: rgba(255, 107, 53, 0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            color: white;
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gray-900);
        }

        .page-subtitle {
            color: var(--gray-600);
            margin-top: 0.5rem;
        }

        /* Workflow Stages */
        .workflow-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .workflow-sidebar {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 107, 53, 0.1);
            height: fit-content;
        }

        .workflow-stages {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .workflow-stage {
            padding: 1rem;
            border-radius: 12px;
            border: 2px solid var(--gray-200);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .workflow-stage.active {
            border-color: var(--ezra-orange);
            background: rgba(255, 107, 53, 0.05);
        }

        .workflow-stage.completed {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .stage-number {
            position: absolute;
            top: -8px;
            left: 12px;
            background: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            border: 2px solid var(--gray-200);
        }

        .workflow-stage.active .stage-number {
            background: var(--ezra-orange);
            color: white;
            border-color: var(--ezra-orange);
        }

        .workflow-stage.completed .stage-number {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .stage-title {
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 0.25rem;
            margin-top: 8px;
        }

        .stage-description {
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        .stage-timeline {
            font-size: 0.75rem;
            color: var(--gray-500);
            margin-top: 0.5rem;
        }

        /* Main Workflow Area */
        .workflow-main {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 107, 53, 0.1);
            overflow: hidden;
        }

        .workflow-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--gray-200);
            background: linear-gradient(135deg, #fafbff 0%, white 100%);
        }

        .dispute-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .summary-card {
            padding: 1rem;
            background: var(--gray-50);
            border-radius: 8px;
            border-left: 4px solid var(--ezra-orange);
        }

        .summary-label {
            font-size: 0.75rem;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .summary-value {
            font-weight: 600;
            color: var(--gray-900);
        }

        /* Resolution Actions */
        .resolution-actions {
            padding: 1.5rem;
        }

        .action-section {
            margin-bottom: 2rem;
        }

        .action-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .action-card {
            padding: 1.5rem;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .action-card:hover {
            border-color: var(--ezra-orange);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .action-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            margin: 0 auto 1rem;
        }

        .action-name {
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .action-description {
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        /* Communications */
        .communications {
            padding: 1.5rem;
            border-top: 1px solid var(--gray-200);
            background: var(--gray-50);
        }

        .message-thread {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }

        .message {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 8px;
            border-left: 3px solid var(--gray-300);
        }

        .message.admin {
            border-left-color: var(--ezra-orange);
        }

        .message.customer {
            border-left-color: var(--info);
        }

        .message.provider {
            border-left-color: var(--success);
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gray-300);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .message-sender {
            font-weight: 600;
            color: var(--gray-900);
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--gray-500);
        }

        .message-text {
            color: var(--gray-700);
            white-space: pre-wrap;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            font-size: 0.875rem;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--ezra-orange);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--ezra-orange);
            color: white;
        }

        .btn-primary:hover {
            background: var(--ezra-orange-dark);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #D97706;
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-danger:hover {
            background: #DC2626;
        }

        .btn-secondary {
            background: var(--gray-200);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-300);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 2rem;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray-500);
            padding: 0.5rem;
        }

        .close:hover {
            color: var(--gray-700);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .workflow-container {
                grid-template-columns: 1fr;
            }
            
            .workflow-stages {
                flex-direction: row;
                overflow-x: auto;
            }
            
            .workflow-stage {
                min-width: 200px;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }

            .dispute-summary {
                grid-template-columns: 1fr;
            }

            .action-grid {
                grid-template-columns: 1fr;
            }
        }

        .hidden {
            display: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--gray-200);
            border-radius: 50%;
            border-top-color: var(--ezra-orange);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <i class="fas fa-crown" style="color: var(--ezra-orange);"></i>
                Ezra Admin
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="user-management.html" class="nav-link">Utilisateurs</a>
                <a href="dispute-management.html" class="nav-link">Réclamations</a>
                <a href="dispute-resolution-workflow.html" class="nav-link active">Résolution</a>
                <a href="reports.html" class="nav-link">Rapports</a>
            </nav>
            <div class="user-info">
                <div id="user-name">Admin</div>
                <button class="btn btn-secondary" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Processus de Résolution</h1>
                <p class="page-subtitle">Workflow de médiation et résolution étape par étape</p>
            </div>
            <button class="btn btn-secondary" onclick="goBackToDisputes()">
                <i class="fas fa-arrow-left"></i> Retour aux Réclamations
            </button>
        </div>

        <div id="loading-state" class="text-center" style="padding: 3rem;">
            <div class="loading"></div>
            <p style="margin-top: 1rem; color: var(--gray-600);">Chargement de la réclamation...</p>
        </div>

        <div id="workflow-content" class="hidden">
            <div class="workflow-container">
                <!-- Workflow Sidebar -->
                <div class="workflow-sidebar">
                    <h3 style="margin-bottom: 1rem; color: var(--gray-900);">Étapes de Résolution</h3>
                    <div class="workflow-stages" id="workflow-stages">
                        <!-- Stages will be loaded here -->
                    </div>
                    
                    <div style="margin-top: 2rem; padding: 1rem; background: var(--gray-50); border-radius: 8px;">
                        <h4 style="color: var(--gray-700); margin-bottom: 0.5rem;">SLA</h4>
                        <div id="sla-info">
                            <div style="font-size: 0.875rem; color: var(--gray-600);">
                                Temps limite: <span id="sla-deadline">-</span>
                            </div>
                            <div id="sla-status" style="font-size: 0.875rem; margin-top: 0.25rem;">
                                Statut: <span id="sla-status-text">En cours</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Main Workflow Area -->
                <div class="workflow-main">
                    <div class="workflow-header">
                        <div class="dispute-summary" id="dispute-summary">
                            <!-- Summary will be loaded here -->
                        </div>
                    </div>

                    <div class="resolution-actions" id="current-stage-content">
                        <!-- Current stage content will be loaded here -->
                    </div>

                    <div class="communications">
                        <h3 style="margin-bottom: 1rem; color: var(--gray-900);">Communications</h3>
                        <div class="message-thread" id="message-thread">
                            <!-- Messages will be loaded here -->
                        </div>

                        <div class="form-group">
                            <label class="form-label">Nouveau message</label>
                            <textarea id="new-message" class="form-textarea" placeholder="Écrivez votre message ici..."></textarea>
                        </div>
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <select id="message-visibility" class="form-select" style="max-width: 200px;">
                                <option value="all">Visible à tous</option>
                                <option value="internal">Note interne</option>
                            </select>
                            <button class="btn btn-primary" onclick="sendMessage()">
                                <i class="fas fa-paper-plane"></i> Envoyer
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Resolution Modal -->
    <div id="resolutionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="resolution-modal-title">Proposer une Résolution</h2>
                <button class="close" onclick="closeResolutionModal()">&times;</button>
            </div>
            <div id="resolution-modal-body">
                <!-- Resolution form will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        let supabase;
        let currentDispute = null;
        let disputeId = null;
        let currentStage = 0;
        
        const workflowStages = [
            {
                name: 'Soumission',
                description: 'Réclamation soumise par le plaignant',
                status: 'submitted',
                icon: 'fas fa-file-alt'
            },
            {
                name: 'Accusé de Réception',
                description: 'Réclamation accusée et assignée',
                status: 'acknowledged',
                icon: 'fas fa-check-circle'
            },
            {
                name: 'Investigation',
                description: 'Collecte d\'informations et analyse',
                status: 'investigating',
                icon: 'fas fa-search'
            },
            {
                name: 'Médiation',
                description: 'Facilitation du dialogue entre parties',
                status: 'under_mediation',
                icon: 'fas fa-handshake'
            },
            {
                name: 'Résolution',
                description: 'Proposition et implémentation de solution',
                status: 'pending_resolution',
                icon: 'fas fa-gavel'
            },
            {
                name: 'Clôture',
                description: 'Réclamation résolue et fermée',
                status: 'resolved',
                icon: 'fas fa-check-double'
            }
        ];

        // Initialize page
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // Get dispute ID from URL
                const urlParams = new URLSearchParams(window.location.search);
                disputeId = urlParams.get('id');
                
                if (!disputeId) {
                    alert('ID de réclamation manquant');
                    window.location.href = 'dispute-management.html';
                    return;
                }

                // Check authentication
                if (!window.supabase || !window.EZRA_CONFIG) {
                    throw new Error('Configuration manquante');
                }

                supabase = window.supabase.createClient(
                    window.EZRA_CONFIG.SUPABASE_URL,
                    window.EZRA_CONFIG.SUPABASE_ANON_KEY
                );

                // Check if user is logged in
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }

                await loadDispute();
                await loadMessages();
                
                console.log('✅ Workflow loaded successfully');
                
            } catch (error) {
                console.error('❌ Workflow initialization error:', error);
                alert('Erreur de chargement: ' + error.message);
            }
        });

        async function loadDispute() {
            try {
                console.log('📋 Loading dispute:', disputeId);

                const { data: dispute, error } = await supabase
                    .from('disputes')
                    .select('*')
                    .eq('id', disputeId)
                    .single();

                if (error) throw error;
                if (!dispute) {
                    alert('Réclamation non trouvée');
                    window.location.href = 'dispute-management.html';
                    return;
                }

                currentDispute = dispute;
                
                // Update UI
                updateWorkflowStages();
                updateDisputeSummary();
                updateSLAInfo();
                updateCurrentStageContent();
                
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('workflow-content').classList.remove('hidden');

            } catch (error) {
                console.error('Error loading dispute:', error);
                alert('Erreur lors du chargement de la réclamation');
            }
        }

        function updateWorkflowStages() {
            const container = document.getElementById('workflow-stages');
            const currentStatusIndex = workflowStages.findIndex(stage => stage.status === currentDispute.status);
            currentStage = Math.max(0, currentStatusIndex);

            container.innerHTML = workflowStages.map((stage, index) => {
                let stageClass = 'workflow-stage';
                if (index < currentStage) stageClass += ' completed';
                if (index === currentStage) stageClass += ' active';

                const timeline = getStageTimeline(stage.status);

                return `
                    <div class="${stageClass}" onclick="selectStage(${index})">
                        <div class="stage-number">${index < currentStage ? '<i class="fas fa-check"></i>' : index + 1}</div>
                        <div class="stage-title">${stage.name}</div>
                        <div class="stage-description">${stage.description}</div>
                        ${timeline ? `<div class="stage-timeline">${timeline}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function getStageTimeline(status) {
            const dispute = currentDispute;
            const created = new Date(dispute.created_at);
            
            switch (status) {
                case 'submitted':
                    return `Soumise le ${created.toLocaleDateString('fr-FR')}`;
                case 'acknowledged':
                    return dispute.assigned_at ? `Assignée le ${new Date(dispute.assigned_at).toLocaleDateString('fr-FR')}` : '';
                case 'investigating':
                    return dispute.first_response_at ? `Démarrée le ${new Date(dispute.first_response_at).toLocaleDateString('fr-FR')}` : '';
                case 'resolved':
                    return dispute.resolved_at ? `Résolue le ${new Date(dispute.resolved_at).toLocaleDateString('fr-FR')}` : '';
                default:
                    return '';
            }
        }

        function updateDisputeSummary() {
            const dispute = currentDispute;
            const container = document.getElementById('dispute-summary');

            container.innerHTML = `
                <div class="summary-card">
                    <div class="summary-label">Numéro</div>
                    <div class="summary-value">${dispute.dispute_number || `DIS-${dispute.id.slice(0, 8)}`}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Titre</div>
                    <div class="summary-value">${dispute.title}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Catégorie</div>
                    <div class="summary-value">${getCategoryLabel(dispute.category)}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Priorité</div>
                    <div class="summary-value">${getPriorityLabel(dispute.priority)}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Plaignant</div>
                    <div class="summary-value">${dispute.complainant_email}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Défendeur</div>
                    <div class="summary-value">${dispute.respondent_email}</div>
                </div>
            `;
        }

        function updateSLAInfo() {
            const dispute = currentDispute;
            const deadline = new Date(dispute.expected_resolution_date);
            const now = new Date();
            
            document.getElementById('sla-deadline').textContent = deadline.toLocaleDateString('fr-FR');
            
            const statusElement = document.getElementById('sla-status-text');
            if (dispute.sla_breached) {
                statusElement.textContent = 'Dépassé';
                statusElement.style.color = 'var(--error)';
            } else if (now > deadline) {
                statusElement.textContent = 'À risque';
                statusElement.style.color = 'var(--warning)';
            } else {
                statusElement.textContent = 'Dans les temps';
                statusElement.style.color = 'var(--success)';
            }
        }

        function updateCurrentStageContent() {
            const container = document.getElementById('current-stage-content');
            const stage = workflowStages[currentStage];
            
            container.innerHTML = `
                <div class="action-section">
                    <h2 class="action-title">
                        <i class="${stage.icon}" style="color: var(--ezra-orange);"></i>
                        ${stage.name}
                    </h2>
                    <p style="color: var(--gray-600); margin-bottom: 1.5rem;">${stage.description}</p>
                    
                    ${getStageActions(stage.status)}
                </div>
            `;
        }

        function getStageActions(status) {
            switch (status) {
                case 'submitted':
                    return `
                        <div class="action-grid">
                            <div class="action-card" onclick="acknowledgeDispute()">
                                <div class="action-icon" style="background: var(--info);">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                                <div class="action-name">Accuser Réception</div>
                                <div class="action-description">Confirmer la réception et assigner</div>
                            </div>
                            <div class="action-card" onclick="escalateDispute()">
                                <div class="action-icon" style="background: var(--warning);">
                                    <i class="fas fa-exclamation-triangle"></i>
                                </div>
                                <div class="action-name">Escalader</div>
                                <div class="action-description">Escalader vers un niveau supérieur</div>
                            </div>
                        </div>
                    `;
                
                case 'acknowledged':
                case 'investigating':
                    return `
                        <div class="action-grid">
                            <div class="action-card" onclick="startMediation()">
                                <div class="action-icon" style="background: var(--success);">
                                    <i class="fas fa-handshake"></i>
                                </div>
                                <div class="action-name">Démarrer Médiation</div>
                                <div class="action-description">Faciliter le dialogue entre parties</div>
                            </div>
                            <div class="action-card" onclick="requestMoreInfo()">
                                <div class="action-icon" style="background: var(--info);">
                                    <i class="fas fa-question-circle"></i>
                                </div>
                                <div class="action-name">Demander Infos</div>
                                <div class="action-description">Demander plus d'informations</div>
                            </div>
                            <div class="action-card" onclick="escalateDispute()">
                                <div class="action-icon" style="background: var(--warning);">
                                    <i class="fas fa-level-up-alt"></i>
                                </div>
                                <div class="action-name">Escalader</div>
                                <div class="action-description">Escalader si nécessaire</div>
                            </div>
                        </div>
                    `;
                
                case 'under_mediation':
                    return `
                        <div class="action-grid">
                            <div class="action-card" onclick="proposeResolution()">
                                <div class="action-icon" style="background: var(--ezra-orange);">
                                    <i class="fas fa-gavel"></i>
                                </div>
                                <div class="action-name">Proposer Résolution</div>
                                <div class="action-description">Proposer une solution</div>
                            </div>
                            <div class="action-card" onclick="scheduleCall()">
                                <div class="action-icon" style="background: var(--info);">
                                    <i class="fas fa-phone"></i>
                                </div>
                                <div class="action-name">Programmer Appel</div>
                                <div class="action-description">Organiser une médiation téléphonique</div>
                            </div>
                            <div class="action-card" onclick="escalateDispute()">
                                <div class="action-icon" style="background: var(--error);">
                                    <i class="fas fa-exclamation-circle"></i>
                                </div>
                                <div class="action-name">Escalader</div>
                                <div class="action-description">Échec de médiation</div>
                            </div>
                        </div>
                    `;
                
                case 'pending_resolution':
                    return `
                        <div class="action-grid">
                            <div class="action-card" onclick="implementResolution()">
                                <div class="action-icon" style="background: var(--success);">
                                    <i class="fas fa-check-double"></i>
                                </div>
                                <div class="action-name">Implémenter</div>
                                <div class="action-description">Mettre en œuvre la résolution</div>
                            </div>
                            <div class="action-card" onclick="modifyResolution()">
                                <div class="action-icon" style="background: var(--warning);">
                                    <i class="fas fa-edit"></i>
                                </div>
                                <div class="action-name">Modifier</div>
                                <div class="action-description">Ajuster la résolution</div>
                            </div>
                        </div>
                    `;
                
                case 'resolved':
                    return `
                        <div style="text-align: center; padding: 2rem; background: var(--gray-50); border-radius: 12px;">
                            <i class="fas fa-check-circle" style="font-size: 3rem; color: var(--success); margin-bottom: 1rem;"></i>
                            <h3 style="color: var(--success); margin-bottom: 0.5rem;">Réclamation Résolue</h3>
                            <p style="color: var(--gray-600);">Cette réclamation a été résolue avec succès.</p>
                            ${currentDispute.resolution_summary ? `
                                <div style="margin-top: 1rem; padding: 1rem; background: white; border-radius: 8px; text-align: left;">
                                    <strong>Résolution:</strong><br>
                                    ${currentDispute.resolution_summary}
                                </div>
                            ` : ''}
                        </div>
                    `;
                
                default:
                    return '<p>Aucune action disponible pour cette étape.</p>';
            }
        }

        async function loadMessages() {
            try {
                const { data: messages, error } = await supabase
                    .from('dispute_messages')
                    .select('*')
                    .eq('dispute_id', disputeId)
                    .order('created_at', { ascending: true });

                if (error) throw error;

                const container = document.getElementById('message-thread');
                
                if (!messages || messages.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--gray-500); padding: 2rem;">Aucun message pour le moment.</p>';
                    return;
                }

                container.innerHTML = messages.map(message => {
                    const avatar = message.sender_email.charAt(0).toUpperCase();
                    const time = new Date(message.created_at).toLocaleString('fr-FR');
                    
                    return `
                        <div class="message ${message.sender_type}">
                            <div class="message-avatar">${avatar}</div>
                            <div class="message-content">
                                <div class="message-header">
                                    <div class="message-sender">${message.sender_email} (${message.sender_type})</div>
                                    <div class="message-time">${time}</div>
                                </div>
                                <div class="message-text">${message.content}</div>
                                ${message.internal_note ? '<div style="color: var(--warning); font-size: 0.75rem; margin-top: 0.25rem;"><i class="fas fa-lock"></i> Note interne</div>' : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function sendMessage() {
            const messageText = document.getElementById('new-message').value.trim();
            const visibility = document.getElementById('message-visibility').value;
            
            if (!messageText) {
                alert('Veuillez saisir un message');
                return;
            }

            try {
                const { data: { user } } = await supabase.auth.getUser();
                
                const messageData = {
                    dispute_id: disputeId,
                    sender_id: user.id,
                    sender_email: user.email,
                    sender_type: 'admin',
                    content: messageText,
                    internal_note: visibility === 'internal',
                    visible_to_complainant: visibility !== 'internal',
                    visible_to_respondent: visibility !== 'internal'
                };

                const { error } = await supabase
                    .from('dispute_messages')
                    .insert([messageData]);

                if (error) throw error;

                // Clear form and reload messages
                document.getElementById('new-message').value = '';
                await loadMessages();

                // Add action log
                await supabase
                    .from('dispute_actions')
                    .insert([{
                        dispute_id: disputeId,
                        action_type: 'admin_note_added',
                        performed_by: user.id,
                        performed_by_email: user.email,
                        performed_by_type: 'admin',
                        action_description: visibility === 'internal' ? 'Note interne ajoutée' : 'Message envoyé aux parties'
                    }]);

            } catch (error) {
                console.error('Error sending message:', error);
                alert('Erreur lors de l\'envoi du message');
            }
        }

        async function acknowledgeDispute() {
            if (!confirm('Accuser réception de cette réclamation?')) return;

            try {
                const { data: { user } } = await supabase.auth.getUser();
                
                const { error } = await supabase
                    .from('disputes')
                    .update({
                        status: 'investigating',
                        assigned_admin_id: user.id,
                        assigned_at: new Date().toISOString(),
                        first_response_at: new Date().toISOString()
                    })
                    .eq('id', disputeId);

                if (error) throw error;

                await loadDispute();

            } catch (error) {
                console.error('Error acknowledging dispute:', error);
                alert('Erreur lors de l\'accusé de réception');
            }
        }

        async function startMediation() {
            if (!confirm('Démarrer le processus de médiation?')) return;

            try {
                const { error } = await supabase
                    .from('disputes')
                    .update({ status: 'under_mediation' })
                    .eq('id', disputeId);

                if (error) throw error;

                await loadDispute();

            } catch (error) {
                console.error('Error starting mediation:', error);
                alert('Erreur lors du démarrage de la médiation');
            }
        }

        function proposeResolution() {
            const modal = document.getElementById('resolutionModal');
            const modalBody = document.getElementById('resolution-modal-body');
            
            modalBody.innerHTML = `
                <div class="form-group">
                    <label class="form-label">Type de résolution</label>
                    <select id="resolution-type" class="form-select">
                        <option value="refund_full">Remboursement complet</option>
                        <option value="refund_partial">Remboursement partiel</option>
                        <option value="service_redo">Refaire le service</option>
                        <option value="compensation">Compensation</option>
                        <option value="warning">Avertissement</option>
                        <option value="no_action">Aucune action</option>
                        <option value="policy_update">Mise à jour des politiques</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Description de la résolution</label>
                    <textarea id="resolution-description" class="form-textarea" placeholder="Décrivez la résolution proposée..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Montant financier (si applicable)</label>
                    <input type="number" id="resolution-amount" class="form-input" placeholder="Montant en FCFA">
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button class="btn btn-secondary" onclick="closeResolutionModal()">Annuler</button>
                    <button class="btn btn-primary" onclick="submitResolution()">Proposer</button>
                </div>
            `;
            
            modal.style.display = 'block';
        }

        async function submitResolution() {
            const type = document.getElementById('resolution-type').value;
            const description = document.getElementById('resolution-description').value.trim();
            const amount = document.getElementById('resolution-amount').value;

            if (!description) {
                alert('Veuillez fournir une description');
                return;
            }

            try {
                const { data: { user } } = await supabase.auth.getUser();

                // Create resolution proposal
                const resolutionData = {
                    dispute_id: disputeId,
                    proposed_by: user.id,
                    proposed_by_type: 'admin',
                    resolution_type: type,
                    description: description,
                    financial_amount: amount ? parseFloat(amount) : null,
                    admin_approved: true
                };

                const { error: resolutionError } = await supabase
                    .from('dispute_resolutions')
                    .insert([resolutionData]);

                if (resolutionError) throw resolutionError;

                // Update dispute status
                const { error: updateError } = await supabase
                    .from('disputes')
                    .update({ status: 'pending_resolution' })
                    .eq('id', disputeId);

                if (updateError) throw updateError;

                closeResolutionModal();
                await loadDispute();

            } catch (error) {
                console.error('Error submitting resolution:', error);
                alert('Erreur lors de la soumission de la résolution');
            }
        }

        async function escalateDispute() {
            const reason = prompt('Raison de l\'escalade:');
            if (!reason) return;

            try {
                const { error } = await supabase
                    .from('disputes')
                    .update({
                        status: 'escalated',
                        escalated_at: new Date().toISOString()
                    })
                    .eq('id', disputeId);

                if (error) throw error;

                await loadDispute();

            } catch (error) {
                console.error('Error escalating dispute:', error);
                alert('Erreur lors de l\'escalade');
            }
        }

        async function implementResolution() {
            if (!confirm('Marquer cette résolution comme implémentée?')) return;

            try {
                const { error } = await supabase
                    .from('disputes')
                    .update({
                        status: 'resolved',
                        resolved_at: new Date().toISOString()
                    })
                    .eq('id', disputeId);

                if (error) throw error;

                await loadDispute();

            } catch (error) {
                console.error('Error implementing resolution:', error);
                alert('Erreur lors de l\'implémentation');
            }
        }

        function requestMoreInfo() {
            const message = prompt('Que souhaitez-vous demander comme information supplémentaire?');
            if (!message) return;

            document.getElementById('new-message').value = `Demande d'information supplémentaire:\n\n${message}`;
        }

        function scheduleCall() {
            alert('Fonctionnalité de planification d\'appel à venir');
        }

        function modifyResolution() {
            proposeResolution();
        }

        function selectStage(stageIndex) {
            // Allow viewing different stages but not changing current stage
            console.log('Selected stage:', stageIndex);
        }

        function closeResolutionModal() {
            document.getElementById('resolutionModal').style.display = 'none';
        }

        function goBackToDisputes() {
            window.location.href = 'dispute-management.html';
        }

        function getCategoryLabel(category) {
            const labels = {
                'service_quality': 'Qualité Service',
                'payment_issue': 'Paiement',
                'cancellation': 'Annulation',
                'no_show': 'Absence',
                'communication': 'Communication',
                'safety_concern': 'Sécurité',
                'billing_dispute': 'Facturation',
                'refund_request': 'Remboursement',
                'property_damage': 'Dommage',
                'contract_violation': 'Contrat',
                'other': 'Autre'
            };
            return labels[category] || category;
        }

        function getPriorityLabel(priority) {
            const labels = {
                'low': 'Basse',
                'medium': 'Moyenne',
                'high': 'Haute',
                'urgent': 'Urgent'
            };
            return labels[priority] || priority;
        }

        async function logout() {
            if (confirm('Êtes-vous sûr de vouloir vous déconnecter?')) {
                try {
                    await supabase.auth.signOut();
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error('Logout error:', error);
                    alert('Erreur lors de la déconnexion');
                }
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('resolutionModal');
            if (event.target === modal) {
                closeResolutionModal();
            }
        }
    </script>
</body>
</html>
