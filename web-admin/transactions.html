<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezra Admin - Surveillance des Transactions</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config-local.js"></script>
    <script src="admin-auth-simple.js"></script>
    <script src="enhanced-security.js"></script>
    <style>
        :root {
            --ezra-orange: #FF6B35;
            --ezra-orange-dark: #E55A2B;
            --ezra-navy: #1B365D;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
            --success: #10B981;
            --error: #EF4444;
            --warning: #F59E0B;
            --info: #3B82F6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--gray-900);
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, var(--ezra-navy) 0%, #2C4B73 100%);
            border-bottom: 1px solid rgba(255, 107, 53, 0.2);
            padding: 1rem 2rem;
            box-shadow: 0 8px 32px rgba(27, 54, 93, 0.15);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .page-title i {
            background: linear-gradient(135deg, var(--ezra-orange), #ff8a5b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(255, 107, 53, 0.3));
        }

        .nav-link {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .nav-link:hover {
            background: var(--ezra-orange);
            color: white;
        }

        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: linear-gradient(135deg, white 0%, #fafbff 100%);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 107, 53, 0.1);
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--ezra-orange), var(--ezra-navy));
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .metric-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .metric-label {
            color: var(--gray-600);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .metric-change {
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .metric-change.positive {
            color: var(--success);
        }

        .metric-change.negative {
            color: var(--error);
        }

        .chart-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .chart-card {
            background: linear-gradient(135deg, white 0%, #fafbff 100%);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 107, 53, 0.1);
            position: relative;
            overflow: hidden;
        }

        .chart-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--ezra-orange), var(--ezra-navy));
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .chart-title {
            font-weight: 700;
            color: var(--gray-900);
            font-size: 1.125rem;
        }

        .transactions-table {
            background: linear-gradient(135deg, white 0%, #fafbff 100%);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 107, 53, 0.1);
            overflow: hidden;
            position: relative;
        }

        .transactions-table::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--ezra-orange), var(--ezra-navy));
        }

        .table-header {
            padding: 2rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .table-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 1rem;
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 8px 12px;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            background: white;
            font-size: 0.875rem;
        }

        .transactions-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--gray-100);
            transition: background 0.2s;
        }

        .transaction-item:hover {
            background: var(--gray-50);
        }

        .transaction-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .transaction-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--ezra-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .transaction-details h4 {
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 2px;
        }

        .transaction-details p {
            font-size: 0.875rem;
            color: var(--gray-500);
        }

        .transaction-amount {
            font-weight: 700;
            font-size: 1.125rem;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 1rem;
        }

        .status-success {
            background: #D1FAE5;
            color: #065F46;
        }

        .status-pending {
            background: #FEF3CD;
            color: #92400E;
        }

        .status-failed {
            background: #FEE2E2;
            color: #991B1B;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray-500);
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }

            .chart-section {
                grid-template-columns: 1fr;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="page-title">
                <i class="fas fa-credit-card"></i>
                Surveillance des Transactions
            </h1>
            <a href="index.html" class="nav-link">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
        </div>
    </header>

    <main class="main-content">
        <!-- Financial Metrics -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-header">
                    <div class="metric-icon" style="background: var(--success);">
                        <i class="fas fa-money-bill-wave"></i>
                    </div>
                </div>
                <div class="metric-value" id="total-volume">0 FCFA</div>
                <div class="metric-label">Volume Total</div>
                <div class="metric-change positive" id="volume-change">+0% ce mois</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <div class="metric-icon" style="background: var(--info);">
                        <i class="fas fa-exchange-alt"></i>
                    </div>
                </div>
                <div class="metric-value" id="total-transactions">0</div>
                <div class="metric-label">Transactions</div>
                <div class="metric-change positive" id="transactions-change">+0% ce mois</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <div class="metric-icon" style="background: var(--ezra-orange);">
                        <i class="fas fa-percentage"></i>
                    </div>
                </div>
                <div class="metric-value" id="commission-revenue">0 FCFA</div>
                <div class="metric-label">Commission Ezra</div>
                <div class="metric-change positive" id="commission-change">+0% ce mois</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <div class="metric-icon" style="background: var(--warning);">
                        <i class="fas fa-chart-line"></i>
                    </div>
                </div>
                <div class="metric-value" id="success-rate">0%</div>
                <div class="metric-label">Taux de Réussite</div>
                <div class="metric-change positive" id="success-change">Stable</div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="chart-section">
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">Volume des Transactions (7 derniers jours)</div>
                    <select class="filter-select" id="chart-period">
                        <option value="7">7 jours</option>
                        <option value="30">30 jours</option>
                        <option value="90">3 mois</option>
                    </select>
                </div>
                <div style="position: relative; height: 300px; width: 100%;">
                    <canvas id="transactionChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">Répartition par Méthode</div>
                </div>
                <div style="position: relative; height: 300px; width: 100%;">
                    <canvas id="paymentMethodChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Transactions Table -->
        <div class="transactions-table">
            <div class="table-header">
                <h3 class="table-title">Transactions Récentes</h3>
                <div class="filters">
                    <select class="filter-select" id="status-filter">
                        <option value="">Tous les statuts</option>
                        <option value="completed">Réussie</option>
                        <option value="pending">En attente</option>
                        <option value="failed">Échouée</option>
                    </select>
                    <select class="filter-select" id="method-filter">
                        <option value="">Toutes les méthodes</option>
                        <option value="mtn_momo">MTN Mobile Money</option>
                        <option value="orange_money">Orange Money</option>
                    </select>
                    <input type="date" class="filter-select" id="date-filter">
                </div>
            </div>
            <div class="transactions-list" id="transactions-list">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Chargement des transactions...
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentTransactions = [];
        let supabase;

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // Initialize Supabase
                supabase = window.supabase.createClient(
                    window.EZRA_CONFIG.SUPABASE_URL,
                    window.EZRA_CONFIG.SUPABASE_ANON_KEY
                );

                // Check authentication
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }

                // Load transaction data
                await loadTransactionMetrics();
                await loadTransactions();
                
                // Initialize charts
                initializeCharts();
                
                // Setup filters
                setupFilters();

            } catch (error) {
                console.error('Initialization error:', error);
                alert('Erreur de chargement: ' + error.message);
            }
        });

        async function loadTransactionMetrics() {
            try {
                // Mock data - replace with real Supabase queries
                const metrics = {
                    totalVolume: 15750000,
                    totalTransactions: 342,
                    commissionRevenue: 2362500,
                    successRate: 96.5
                };

                document.getElementById('total-volume').textContent = metrics.totalVolume.toLocaleString() + ' FCFA';
                document.getElementById('total-transactions').textContent = metrics.totalTransactions.toLocaleString();
                document.getElementById('commission-revenue').textContent = metrics.commissionRevenue.toLocaleString() + ' FCFA';
                document.getElementById('success-rate').textContent = metrics.successRate + '%';

            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }

        async function loadTransactions() {
            try {
                // Mock transaction data - replace with real Supabase query
                const transactions = [
                    {
                        id: '1',
                        user_name: 'Marie Kouam',
                        service: 'Nettoyage à domicile',
                        amount: 15000,
                        method: 'MTN Mobile Money',
                        status: 'completed',
                        created_at: new Date(Date.now() - 1000 * 60 * 30) // 30 minutes ago
                    },
                    {
                        id: '2',
                        user_name: 'Paul Mbarga',
                        service: 'Réparation électrique',
                        amount: 25000,
                        method: 'Orange Money',
                        status: 'completed',
                        created_at: new Date(Date.now() - 1000 * 60 * 60 * 2) // 2 hours ago
                    },
                    {
                        id: '3',
                        user_name: 'Sophie Ndongo',
                        service: 'Cours particuliers',
                        amount: 12000,
                        method: 'MTN Mobile Money',
                        status: 'pending',
                        created_at: new Date(Date.now() - 1000 * 60 * 60 * 4) // 4 hours ago
                    },
                    {
                        id: '4',
                        user_name: 'Jean Fotso',
                        service: 'Livraison',
                        amount: 3500,
                        method: 'Orange Money',
                        status: 'failed',
                        created_at: new Date(Date.now() - 1000 * 60 * 60 * 6) // 6 hours ago
                    }
                ];

                currentTransactions = transactions;
                displayTransactions(transactions);

            } catch (error) {
                console.error('Error loading transactions:', error);
                document.getElementById('transactions-list').innerHTML = 
                    '<div class="loading">Erreur de chargement des transactions</div>';
            }
        }

        function displayTransactions(transactions) {
            const container = document.getElementById('transactions-list');
            
            if (transactions.length === 0) {
                container.innerHTML = '<div class="loading">Aucune transaction trouvée</div>';
                return;
            }

            const transactionsHTML = transactions.map(transaction => {
                const statusClass = getStatusClass(transaction.status);
                const statusText = getStatusText(transaction.status);
                const timeAgo = getTimeAgo(transaction.created_at);
                const initials = transaction.user_name.split(' ').map(n => n[0]).join('').toUpperCase();

                return `
                    <div class="transaction-item">
                        <div class="transaction-info">
                            <div class="transaction-avatar">${initials}</div>
                            <div class="transaction-details">
                                <h4>${transaction.user_name}</h4>
                                <p>${transaction.service} • ${transaction.method}</p>
                                <p style="font-size: 0.75rem; color: var(--gray-400);">${timeAgo}</p>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <div class="transaction-amount" style="color: ${transaction.status === 'completed' ? 'var(--success)' : 'var(--gray-600)'};">
                                ${transaction.amount.toLocaleString()} FCFA
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = transactionsHTML;
        }

        function getStatusClass(status) {
            switch (status) {
                case 'completed': return 'status-success';
                case 'pending': return 'status-pending';
                case 'failed': return 'status-failed';
                default: return 'status-pending';
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'completed': return 'Réussie';
                case 'pending': return 'En attente';
                case 'failed': return 'Échouée';
                default: return 'Inconnu';
            }
        }

        function getTimeAgo(date) {
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / (1000 * 60));
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            if (minutes < 60) return `Il y a ${minutes} min`;
            if (hours < 24) return `Il y a ${hours}h`;
            return `Il y a ${days} jour(s)`;
        }

        function initializeCharts() {
            // Transaction Volume Chart
            const ctx1 = document.getElementById('transactionChart').getContext('2d');
            const gradient1 = ctx1.createLinearGradient(0, 0, 0, 300);
            gradient1.addColorStop(0, 'rgba(255, 107, 53, 0.2)');
            gradient1.addColorStop(1, 'rgba(255, 107, 53, 0.02)');

            new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
                    datasets: [{
                        label: 'Volume (FCFA)',
                        data: [2100000, 2850000, 3200000, 2750000, 3100000, 2950000, 3450000],
                        borderColor: '#FF6B35',
                        backgroundColor: gradient1,
                        borderWidth: 3,
                        pointBackgroundColor: '#FF6B35',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { grid: { display: false } },
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(107, 114, 128, 0.1)' },
                            ticks: {
                                callback: function(value) {
                                    return (value / 1000000).toFixed(1) + 'M FCFA';
                                }
                            }
                        }
                    }
                }
            });

            // Payment Method Chart
            const ctx2 = document.getElementById('paymentMethodChart').getContext('2d');
            new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['MTN Mobile Money', 'Orange Money'],
                    datasets: [{
                        data: [65, 35],
                        backgroundColor: ['#FFCD00', '#FF6600'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                usePointStyle: true
                            }
                        }
                    }
                }
            });
        }

        function setupFilters() {
            document.getElementById('status-filter').addEventListener('change', filterTransactions);
            document.getElementById('method-filter').addEventListener('change', filterTransactions);
            document.getElementById('date-filter').addEventListener('change', filterTransactions);
        }

        function filterTransactions() {
            const statusFilter = document.getElementById('status-filter').value;
            const methodFilter = document.getElementById('method-filter').value;
            const dateFilter = document.getElementById('date-filter').value;

            let filteredTransactions = currentTransactions.filter(transaction => {
                const matchesStatus = !statusFilter || transaction.status === statusFilter;
                const matchesMethod = !methodFilter || transaction.method.toLowerCase().includes(methodFilter.replace('_', ' '));
                const matchesDate = !dateFilter || transaction.created_at.toDateString() === new Date(dateFilter).toDateString();

                return matchesStatus && matchesMethod && matchesDate;
            });

            displayTransactions(filteredTransactions);
        }
    </script>
</body>
</html>
