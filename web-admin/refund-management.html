<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Remboursements - Ezra Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .status-pending { @apply bg-yellow-100 text-yellow-800; }
        .status-approved { @apply bg-green-100 text-green-800; }
        .status-rejected { @apply bg-red-100 text-red-800; }
        .status-processed { @apply bg-blue-100 text-blue-800; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="hover:text-blue-200">
                    <i class="fas fa-arrow-left mr-2"></i>Tableau de bord
                </a>
            </div>
            <h1 class="text-xl font-bold">Gestion des Remboursements</h1>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <!-- Quick Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
                        <i class="fas fa-clock text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-600">En Attente</p>
                        <p class="text-2xl font-semibold" id="pendingCount">-</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-green-100 text-green-600">
                        <i class="fas fa-check-circle text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-600">Approuvés</p>
                        <p class="text-2xl font-semibold" id="approvedCount">-</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                        <i class="fas fa-money-bill-wave text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-600">Montant Total</p>
                        <p class="text-2xl font-semibold" id="totalAmount">-</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-purple-100 text-purple-600">
                        <i class="fas fa-calendar-day text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-600">Ce Mois</p>
                        <p class="text-2xl font-semibold" id="monthlyCount">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters and Actions -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex flex-wrap items-center gap-4">
                    <div>
                        <select id="statusFilter" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Tous les statuts</option>
                            <option value="pending">En attente</option>
                            <option value="approved">Approuvé</option>
                            <option value="rejected">Rejeté</option>
                            <option value="processed">Traité</option>
                        </select>
                    </div>
                    
                    <div>
                        <input type="date" id="dateFilter" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div>
                        <input type="text" id="searchFilter" placeholder="Rechercher par ID ou nom..." 
                               class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <button onclick="applyFilters()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                        <i class="fas fa-search mr-2"></i>Filtrer
                    </button>
                </div>
                
                <div class="flex gap-2">
                    <button onclick="exportRefunds()" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                        <i class="fas fa-download mr-2"></i>Exporter
                    </button>
                    <button onclick="openBulkActions()" class="px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700">
                        <i class="fas fa-tasks mr-2"></i>Actions groupées
                    </button>
                </div>
            </div>
        </div>

        <!-- Refunds Table -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Client</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Prestataire</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Montant</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Raison</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Statut</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="refundsTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Refunds will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="flex items-center justify-between mt-6">
            <div class="text-sm text-gray-700">
                Affichage de <span id="startRecord">1</span> à <span id="endRecord">10</span> sur <span id="totalRecords">0</span> résultats
            </div>
            <div class="flex space-x-2">
                <button onclick="previousPage()" class="px-3 py-2 border border-gray-300 rounded-md hover:bg-gray-50">Précédent</button>
                <span id="currentPage" class="px-3 py-2">1</span>
                <button onclick="nextPage()" class="px-3 py-2 border border-gray-300 rounded-md hover:bg-gray-50">Suivant</button>
            </div>
        </div>
    </div>

    <!-- Refund Details Modal -->
    <div id="refundModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-2xl w-full max-h-screen overflow-y-auto">
                <div class="p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-medium">Détails du Remboursement</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <div id="refundDetails">
                        <!-- Details will be loaded here -->
                    </div>
                    
                    <div class="mt-6 flex justify-end space-x-3">
                        <button onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50">
                            Fermer
                        </button>
                        <button id="approveBtn" onclick="processRefund('approved')" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                            <i class="fas fa-check mr-2"></i>Approuver
                        </button>
                        <button id="rejectBtn" onclick="processRefund('rejected')" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">
                            <i class="fas fa-times mr-2"></i>Rejeter
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config-local.js"></script>
    <script>
        // Initialize Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentPage = 1;
        let itemsPerPage = 10;
        let currentRefunds = [];
        let selectedRefundId = null;

        // Load refunds on page load
        window.addEventListener('load', async function() {
            await checkAdminAuth();
            await loadRefunds();
            await loadStats();
        });

        async function checkAdminAuth() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const { data: profile } = await supabase
                .from('profiles')
                .select('role, permissions')
                .eq('id', user.id)
                .single();

            if (!profile || profile.role !== 'admin' || 
                !profile.permissions?.includes('refunds')) {
                alert('Accès non autorisé');
                window.location.href = 'index.html';
            }
        }

        async function loadRefunds() {
            try {
                const { data: refunds, error } = await supabase
                    .from('refunds')
                    .select(`
                        *,
                        booking:bookings(*),
                        payment:payments(*),
                        customer:profiles!refunds_booking_id_fkey(full_name, email),
                        provider:profiles!refunds_payment_id_fkey(full_name, email)
                    `)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                currentRefunds = refunds || [];
                renderRefundsTable();
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors du chargement des remboursements');
            }
        }

        async function loadStats() {
            try {
                const { data: stats, error } = await supabase
                    .from('refunds')
                    .select('status, amount, created_at');

                if (error) throw error;

                const pending = stats.filter(r => r.status === 'pending').length;
                const approved = stats.filter(r => r.status === 'approved').length;
                const totalAmount = stats.reduce((sum, r) => sum + parseFloat(r.amount || 0), 0);
                
                const thisMonth = new Date();
                thisMonth.setDate(1);
                const monthly = stats.filter(r => new Date(r.created_at) >= thisMonth).length;

                document.getElementById('pendingCount').textContent = pending;
                document.getElementById('approvedCount').textContent = approved;
                document.getElementById('totalAmount').textContent = totalAmount.toLocaleString() + ' FCFA';
                document.getElementById('monthlyCount').textContent = monthly;
            } catch (error) {
                console.error('Erreur stats:', error);
            }
        }

        function renderRefundsTable() {
            const tbody = document.getElementById('refundsTableBody');
            
            if (currentRefunds.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="px-6 py-4 text-center text-gray-500">
                            <i class="fas fa-inbox text-3xl mb-2"></i>
                            <p>Aucun remboursement trouvé</p>
                        </td>
                    </tr>
                `;
                return;
            }

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageRefunds = currentRefunds.slice(start, end);

            tbody.innerHTML = pageRefunds.map(refund => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <input type="checkbox" class="refund-checkbox" value="${refund.id}">
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                        #${refund.id.slice(0, 8)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${refund.customer?.full_name || 'N/A'}
                        <br><span class="text-xs text-gray-500">${refund.customer?.email || ''}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${refund.provider?.full_name || 'N/A'}
                        <br><span class="text-xs text-gray-500">${refund.provider?.email || ''}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                        ${parseFloat(refund.amount).toLocaleString()} FCFA
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900 max-w-xs truncate">
                        ${refund.reason || 'Non spécifiée'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full status-${refund.status}">
                            ${getStatusText(refund.status)}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${new Date(refund.created_at).toLocaleDateString('fr-FR')}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="viewRefund('${refund.id}')" class="text-blue-600 hover:text-blue-900 mr-2">
                            <i class="fas fa-eye"></i>
                        </button>
                        ${refund.status === 'pending' ? `
                            <button onclick="quickApprove('${refund.id}')" class="text-green-600 hover:text-green-900 mr-2">
                                <i class="fas fa-check"></i>
                            </button>
                            <button onclick="quickReject('${refund.id}')" class="text-red-600 hover:text-red-900">
                                <i class="fas fa-times"></i>
                            </button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');

            updatePaginationInfo();
        }

        function getStatusText(status) {
            const statusMap = {
                'pending': 'En attente',
                'approved': 'Approuvé',
                'rejected': 'Rejeté',
                'processed': 'Traité'
            };
            return statusMap[status] || status;
        }

        async function viewRefund(refundId) {
            const refund = currentRefunds.find(r => r.id === refundId);
            if (!refund) return;

            selectedRefundId = refundId;
            
            document.getElementById('refundDetails').innerHTML = `
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-sm font-medium text-gray-500">ID Remboursement</label>
                            <p class="mt-1">#${refund.id}</p>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-500">Montant</label>
                            <p class="mt-1 text-lg font-semibold">${parseFloat(refund.amount).toLocaleString()} FCFA</p>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-500">Client</label>
                            <p class="mt-1">${refund.customer?.full_name || 'N/A'}</p>
                            <p class="text-sm text-gray-500">${refund.customer?.email || ''}</p>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-500">Prestataire</label>
                            <p class="mt-1">${refund.provider?.full_name || 'N/A'}</p>
                            <p class="text-sm text-gray-500">${refund.provider?.email || ''}</p>
                        </div>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-500">Raison du remboursement</label>
                        <p class="mt-1 p-3 bg-gray-50 rounded-md">${refund.reason || 'Non spécifiée'}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-sm font-medium text-gray-500">Statut</label>
                            <p class="mt-1">
                                <span class="px-2 py-1 text-xs font-semibold rounded-full status-${refund.status}">
                                    ${getStatusText(refund.status)}
                                </span>
                            </p>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-500">Date de demande</label>
                            <p class="mt-1">${new Date(refund.created_at).toLocaleString('fr-FR')}</p>
                        </div>
                    </div>
                    ${refund.processed_at ? `
                        <div>
                            <label class="text-sm font-medium text-gray-500">Date de traitement</label>
                            <p class="mt-1">${new Date(refund.processed_at).toLocaleString('fr-FR')}</p>
                        </div>
                    ` : ''}
                </div>
            `;

            // Show/hide action buttons based on status
            const approveBtn = document.getElementById('approveBtn');
            const rejectBtn = document.getElementById('rejectBtn');
            
            if (refund.status === 'pending') {
                approveBtn.style.display = 'inline-block';
                rejectBtn.style.display = 'inline-block';
            } else {
                approveBtn.style.display = 'none';
                rejectBtn.style.display = 'none';
            }

            document.getElementById('refundModal').classList.remove('hidden');
        }

        async function processRefund(action) {
            if (!selectedRefundId) return;

            const reason = action === 'rejected' ? 
                prompt('Raison du rejet (optionnel):') : null;

            try {
                const { data: { user } } = await supabase.auth.getUser();
                
                const { error } = await supabase
                    .from('refunds')
                    .update({
                        status: action,
                        processed_by: user.id,
                        processed_at: new Date().toISOString(),
                        admin_notes: reason
                    })
                    .eq('id', selectedRefundId);

                if (error) throw error;

                // Log admin action
                await logAdminAction(`refund_${action}`, selectedRefundId, 
                    `Remboursement ${action === 'approved' ? 'approuvé' : 'rejeté'}`);

                closeModal();
                await loadRefunds();
                await loadStats();
                
                alert(`Remboursement ${action === 'approved' ? 'approuvé' : 'rejeté'} avec succès`);
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors du traitement');
            }
        }

        async function quickApprove(refundId) {
            selectedRefundId = refundId;
            await processRefund('approved');
        }

        async function quickReject(refundId) {
            selectedRefundId = refundId;
            await processRefund('rejected');
        }

        function closeModal() {
            document.getElementById('refundModal').classList.add('hidden');
            selectedRefundId = null;
        }

        function applyFilters() {
            // Implementation for filtering logic
            loadRefunds();
        }

        function exportRefunds() {
            // Implementation for CSV export
            alert('Export en cours de développement');
        }

        function openBulkActions() {
            // Implementation for bulk actions
            alert('Actions groupées en cours de développement');
        }

        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('.refund-checkbox');
            const selectAll = document.getElementById('selectAll');
            
            checkboxes.forEach(checkbox => {
                checkbox.checked = selectAll.checked;
            });
        }

        function updatePaginationInfo() {
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, currentRefunds.length);
            
            document.getElementById('startRecord').textContent = start;
            document.getElementById('endRecord').textContent = end;
            document.getElementById('totalRecords').textContent = currentRefunds.length;
            document.getElementById('currentPage').textContent = currentPage;
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderRefundsTable();
            }
        }

        function nextPage() {
            const maxPage = Math.ceil(currentRefunds.length / itemsPerPage);
            if (currentPage < maxPage) {
                currentPage++;
                renderRefundsTable();
            }
        }

        async function logAdminAction(actionType, targetId, description) {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                await supabase.from('admin_actions').insert({
                    admin_id: user.id,
                    action_type: actionType,
                    target_user_id: targetId,
                    description: description
                });
            } catch (error) {
                console.error('Erreur log:', error);
            }
        }
    </script>
</body>
</html>
