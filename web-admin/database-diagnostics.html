<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezra Admin - Diagnostics Base de Données</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config-local.js"></script>
    <script src="admin-auth-simple.js"></script>
    <script src="enhanced-security.js"></script>
    <style>
        :root {
            --ezra-orange: #FF6B35;
            --ezra-navy: #1B365D;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-900: #111827;
            --success: #10B981;
            --error: #EF4444;
            --warning: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--gray-900);
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, var(--ezra-navy) 0%, #2C4B73 100%);
            border-bottom: 1px solid rgba(255, 107, 53, 0.2);
            padding: 1rem 2rem;
            box-shadow: 0 8px 32px rgba(27, 54, 93, 0.15);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .nav-link {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: var(--ezra-orange);
            color: white;
        }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .diagnostic-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .diagnostic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--ezra-orange), var(--ezra-navy));
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: var(--ezra-orange);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 1rem;
            margin-bottom: 1rem;
        }

        .btn:hover {
            background: #E55A2B;
        }

        .results {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--gray-50);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .status-success { color: var(--success); }
        .status-error { color: var(--error); }
        .status-warning { color: var(--warning); }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .table-info {
            background: var(--gray-50);
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid var(--ezra-orange);
        }

        .table-name {
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .table-status {
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="page-title">
                <i class="fas fa-database"></i>
                Diagnostics Base de Données
            </h1>
            <a href="user-management.html" class="nav-link">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
        </div>
    </header>

    <main class="main-content">
        <div class="diagnostic-card">
            <h2 class="card-title">
                <i class="fas fa-stethoscope"></i>
                Tests de Connexion
            </h2>
            <p>Vérifiez la connectivité et les permissions de votre base de données Supabase.</p>
            
            <button class="btn" onclick="testBasicConnection()">
                <i class="fas fa-plug"></i> Test Connexion
            </button>
            
            <button class="btn" onclick="testAuthAccess()">
                <i class="fas fa-user-shield"></i> Test Auth
            </button>
            
            <button class="btn" onclick="testTableAccess()">
                <i class="fas fa-table"></i> Test Tables
            </button>
            
            <button class="btn" onclick="runFullDiagnostic()">
                <i class="fas fa-search"></i> Diagnostic Complet
            </button>
            
            <div id="results" class="results" style="display: none;"></div>
        </div>

        <div class="diagnostic-card">
            <h2 class="card-title">
                <i class="fas fa-list"></i>
                Structure des Tables
            </h2>
            <p>État des tables principales de l'application Ezra.</p>
            
            <div id="tables-status" class="table-grid">
                <!-- Table status will be loaded here -->
            </div>
        </div>

        <div class="diagnostic-card">
            <h2 class="card-title">
                <i class="fas fa-users"></i>
                Utilisateurs Existants
            </h2>
            <p>Aperçu des utilisateurs présents dans le système.</p>
            
            <button class="btn" onclick="loadUsersSummary()">
                <i class="fas fa-refresh"></i> Charger Résumé
            </button>
            
            <div id="users-summary" class="results" style="display: none;"></div>
        </div>
    </main>

    <script>
        let supabase;

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                supabase = window.supabase.createClient(
                    window.EZRA_CONFIG.SUPABASE_URL,
                    window.EZRA_CONFIG.SUPABASE_ANON_KEY
                );

                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }

                // Auto-run basic diagnostic
                await runFullDiagnostic();

            } catch (error) {
                console.error('Initialization error:', error);
                showResult(`❌ Erreur d'initialisation: ${error.message}`, 'error');
            }
        });

        function showResult(message, type = 'info') {
            const results = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            
            const statusClass = {
                'success': 'status-success',
                'error': 'status-error',
                'warning': 'status-warning'
            }[type] || '';

            results.innerHTML += `<div class="${statusClass}">[${timestamp}] ${message}</div>`;
            results.style.display = 'block';
            results.scrollTop = results.scrollHeight;
        }

        async function testBasicConnection() {
            showResult('🔍 Test de connexion Supabase...', 'info');
            
            try {
                const { data, error } = await supabase
                    .from('information_schema.tables')
                    .select('table_name')
                    .limit(1);

                if (error) {
                    showResult(`❌ Connexion échouée: ${error.message}`, 'error');
                } else {
                    showResult('✅ Connexion Supabase réussie!', 'success');
                }
            } catch (error) {
                showResult(`❌ Erreur de connexion: ${error.message}`, 'error');
            }
        }

        async function testAuthAccess() {
            showResult('🔍 Test d\'accès authentification...', 'info');
            
            try {
                const { data: user } = await supabase.auth.getUser();
                showResult(`✅ Utilisateur connecté: ${user.user?.email}`, 'success');

                // Test admin access
                try {
                    const { data: authUsers } = await supabase.auth.admin.listUsers();
                    showResult(`✅ Accès admin: ${authUsers?.users?.length || 0} utilisateurs trouvés`, 'success');
                } catch (adminError) {
                    showResult(`⚠️ Accès admin limité: ${adminError.message}`, 'warning');
                }

            } catch (error) {
                showResult(`❌ Erreur auth: ${error.message}`, 'error');
            }
        }

        async function testTableAccess() {
            showResult('🔍 Test d\'accès aux tables...', 'info');
            
            const tables = ['profiles', 'bookings', 'payments', 'reviews', 'services'];
            
            for (const table of tables) {
                try {
                    const { count, error } = await supabase
                        .from(table)
                        .select('*', { count: 'exact', head: true });

                    if (error) {
                        showResult(`❌ Table '${table}': ${error.message}`, 'error');
                    } else {
                        showResult(`✅ Table '${table}': ${count || 0} enregistrements`, 'success');
                    }
                } catch (error) {
                    showResult(`❌ Table '${table}': ${error.message}`, 'error');
                }
            }
        }

        async function runFullDiagnostic() {
            document.getElementById('results').innerHTML = '';
            showResult('🚀 Début du diagnostic complet...', 'info');
            
            await testBasicConnection();
            await testAuthAccess();
            await testTableAccess();
            
            showResult('✅ Diagnostic complet terminé!', 'success');
            
            // Update table status
            await updateTableStatus();
        }

        async function updateTableStatus() {
            const tablesContainer = document.getElementById('tables-status');
            const tables = [
                { name: 'profiles', description: 'Profils utilisateurs' },
                { name: 'bookings', description: 'Réservations' },
                { name: 'payments', description: 'Paiements' },
                { name: 'reviews', description: 'Avis clients' },
                { name: 'services', description: 'Services offerts' },
                { name: 'admin_actions', description: 'Actions admin' }
            ];

            let html = '';
            
            for (const table of tables) {
                try {
                    const { count, error } = await supabase
                        .from(table.name)
                        .select('*', { count: 'exact', head: true });

                    const status = error ? 'Erreur d\'accès' : `${count || 0} enregistrements`;
                    const statusClass = error ? 'status-error' : 'status-success';

                    html += `
                        <div class="table-info">
                            <div class="table-name">${table.name}</div>
                            <div class="table-status ${statusClass}">${status}</div>
                            <div style="font-size: 0.75rem; color: var(--gray-600);">${table.description}</div>
                        </div>
                    `;
                } catch (error) {
                    html += `
                        <div class="table-info">
                            <div class="table-name">${table.name}</div>
                            <div class="table-status status-error">Non accessible</div>
                            <div style="font-size: 0.75rem; color: var(--gray-600);">${table.description}</div>
                        </div>
                    `;
                }
            }
            
            tablesContainer.innerHTML = html;
        }

        async function loadUsersSummary() {
            const summaryDiv = document.getElementById('users-summary');
            summaryDiv.innerHTML = '🔍 Chargement...';
            summaryDiv.style.display = 'block';

            try {
                // Try profiles table first
                const { data: profiles, error: profilesError } = await supabase
                    .from('profiles')
                    .select('id, email, role, provider_verified, created_at')
                    .limit(10);

                if (profilesError) {
                    summaryDiv.innerHTML = `❌ Erreur profiles: ${profilesError.message}\n\n`;
                    
                    // Try auth users as fallback
                    try {
                        const { data: authUsers } = await supabase.auth.admin.listUsers();
                        const users = authUsers?.users?.slice(0, 10) || [];
                        
                        let summary = `✅ Utilisateurs via auth.users (${authUsers?.users?.length || 0} total):\n\n`;
                        
                        users.forEach((user, index) => {
                            summary += `${index + 1}. ${user.email}\n`;
                            summary += `   - ID: ${user.id}\n`;
                            summary += `   - Créé: ${new Date(user.created_at).toLocaleDateString()}\n`;
                            summary += `   - Rôle: ${user.user_metadata?.role || 'non défini'}\n\n`;
                        });
                        
                        summaryDiv.innerHTML += summary;
                    } catch (authError) {
                        summaryDiv.innerHTML += `❌ Erreur auth: ${authError.message}`;
                    }
                } else {
                    let summary = `✅ Utilisateurs via profiles (${profiles?.length || 0} affichés):\n\n`;
                    
                    profiles?.forEach((user, index) => {
                        summary += `${index + 1}. ${user.email || 'Email non défini'}\n`;
                        summary += `   - ID: ${user.id}\n`;
                        summary += `   - Rôle: ${user.role || 'customer'}\n`;
                        summary += `   - Prestataire vérifié: ${user.provider_verified ? 'Oui' : 'Non'}\n`;
                        summary += `   - Créé: ${new Date(user.created_at).toLocaleDateString()}\n\n`;
                    });
                    
                    summaryDiv.innerHTML = summary;
                }

            } catch (error) {
                summaryDiv.innerHTML = `❌ Erreur: ${error.message}`;
            }
        }
    </script>
</body>
</html>
